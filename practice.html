<h2>اليوم 1: من الأضرار إلى الضوابط والإشعارات</h2>
<ol>
<li><p>في خدمة الإيجار الطارئ أربعة أضرار. بالمصفوفة وقاعدة المقرر، أيها الأول؟</p><ul><li><b>أ.</b> المالك يعرف بالطلب: أثر 3، غير مرجّح، لا يُتراجع عنه</li><li><b>ب.</b> طلب عادي يتقدم في الصف: أثر 2، شبه المؤكد، يُتراجع عنه</li><li><b>ج.</b> طلب عاجل يُقترح «عاديًا»: أثر 4، غير مرجّح، لا يُتراجع عنه</li><li><b>د.</b> الخطاب بالعربية وحدها: أثر 2، مرجّح، بكلفة</li></ul></li>
<li><p>لمساعد الإيجار الطارئ، كتب أربعة أعضاء في الفريق أربعة ضوابط. أيها يستطيع مسؤول التقييم أن يقول إنه فشل؟</p><ul><li><b>أ.</b> كل أولوية «عادي» على إشعار إخلاء مصور تُعلَّم للتحقق، في 100% من الحالات</li><li><b>ب.</b> تُخفَّض الأخطاء في الطلبات المصورة إلى أقل ما يمكن، ويتابع ذلك قائد التطوير كل شهر</li><li><b>ج.</b> يتدرب الأخصائيون على مراجعة الطلبات المصورة</li><li><b>د.</b> لوحة متابعة أسبوعية لجودة المساعد</li></ul></li>
<li><p>اختُبرت أربع نسخ من خطاب الإيجار الطارئ على قراء من الأقران. القاعدة: قارئان على الأقل، وكل قارئ أربعة من خمسة.</p><ul><li><b>أ.</b> ثلاثة قراء: 5 و4 و3</li><li><b>ب.</b> قارئ واحد أجاب عن الأسئلة الخمسة</li><li><b>ج.</b> العربية 5 و5، والإنجليزية لم تُختبر</li><li><b>د.</b> قارئان، أجاب كل منهما عن 4</li></ul></li>
<li><p>مساعد يقترح مواعيد الزيارات المنزلية للأخصائيين في جمعية افتراضية. أي هؤلاء يتأثر به دون أن يستخدمه؟</p><ul><li><b>أ.</b> الأخصائي الذي يقرأ المواعيد المقترحة ويعدّلها حين يلزم</li><li><b>ب.</b> مشرف الأخصائيين الذي يعتمد جدول الزيارات الأسبوعي كله قبل نشره</li><li><b>ج.</b> الجار الذي يُترك عنده مفتاح بيت المسن حين تتأخر الزيارة</li><li><b>د.</b> مطوّر المساعد الذي يصلح أخطاءه</li></ul></li>
<li><p>في سجل أضرار، ضرر أثره «مرتفع» (3) واحتماليته «غير مرجّح» (2). ما مستواه في مصفوفة الإطار الوطني؟</p><ul><li><b>أ.</b> 6، وهو خطر متوسط</li><li><b>ب.</b> 5، وهو خطر متوسط أيضًا</li><li><b>ج.</b> 6، وهو خطر مرتفع</li><li><b>د.</b> 3، وهو خطر منخفض</li></ul></li>
<li><p>في تجربة مساعد يرتب طلبات منح دراسية، اعتمد الموظفون 97% من ترتيباته دون تعديل. ماذا يقول هذا الرقم عن احتمالية ضرر «طلب مستحق يُرتب في آخر القائمة»؟</p><ul><li><b>أ.</b> الاحتمالية نادرة، لأن الموظفين نادرًا ما يغيرون الترتيب</li><li><b>ب.</b> لا يقول شيئًا عنها حتى تعاد دراسة عينة عشوائية بيد غير من اعتمد</li><li><b>ج.</b> الاحتمالية شبه مؤكدة، لأن الاعتماد العالي علامة موافقة شكلية دائمًا</li><li><b>د.</b> الاحتمالية متوسطة، لأن 3% غُيّر</li></ul></li>
<li><p>في قاعدة المقرر، إذا تساوى ضرران في مستوى الخطر، يتقدم الضرر الذي لا يُتراجع عنه على الضرر الذي يُتراجع عنه بكلفة.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>لمساعد يلخص شكاوى المستأجرين، أي هذه الصياغات متطلب لضابط يستطيع غير صاحبه أن يقول إنه فشل؟</p><ul><li><b>أ.</b> يلخص المساعد كل شكوى بدقة وإنصاف، ويحرص الفريق على أن تبقى جودة الملخصات عالية دائمًا في كل اللغات</li><li><b>ب.</b> يراجع فريق الجودة عينة من الملخصات كل شهر، ويكتب للإدارة تقريرًا بما وجده فيها</li><li><b>ج.</b> يتدرب الموظفون على قراءة الملخصات بحذر، ويُذكَّرون بذلك في اجتماع الفريق الشهري كل مرة</li><li><b>د.</b> كل ملخص يذكر تاريخ الشكوى ونوعها في 100% من الحالات، لكل لغة شكوى فيها 30 حالة على الأقل</li></ul></li>
<li><p>اختبار على مساعد لترتيب طلبات المنح: نسبة الخطأ 4.6% في المجموع والعتبة 5%. في شريحة المتقدمين من القرى 7 أخطاء من 60. ماذا يذهب إلى لجنة الإطلاق؟</p><ul><li><b>أ.</b> اجتياز، لأن المجموع تحت العتبة</li><li><b>ب.</b> إخفاق في شريحة القرى (11.7%)، مع نتيجة المجموع</li><li><b>ج.</b> لا شيء يُرفع حتى يُجمع عدد أكبر من الطلبات في المجموع كله</li><li><b>د.</b> اجتياز مشروط بمتوسط الشريحتين</li></ul></li>
<li><p>ضابط شريحته «المستندات المختلطة اللغة»، وحده الأدنى 20، وفي مجموعة الاختبار 9 حالات منها خطأ واحد. ما نتيجة الضابط؟</p><ul><li><b>أ.</b> اجتياز، لأن خطأً واحدًا في تسع حالات قليل ولا يستحق التوقف عنده</li><li><b>ب.</b> إخفاق، لأن النسبة 11% فوق العتبة المكتوبة في الضابط لهذه الشريحة</li><li><b>ج.</b> اجتياز مؤقت حتى يكتمل العدد في الشريحة، ثم يُعاد الحكم عليها بعد الإطلاق بشهر</li><li><b>د.</b> عدد لا يكفي: لا يُعد اجتيازًا، ويُكتب ماذا يحدث للشريحة حتى يكفي</li></ul></li>
<li><p>يجوز أن يكون مالك الضابط هو من يعتمد نتيجة اختباره، إذا كان الأكثر معرفة بالمساعد.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>خطاب قرار يبدأ: «بعد الدراسة والتحليل وفقًا للمعايير المعتمدة تعذر قبول طلبكم». أي سؤال من أسئلة الفهم يفوت القارئ أولًا؟</p><ul><li><b>أ.</b> لماذا لم يُقبل الطلب</li><li><b>ب.</b> ما اسم الجمعية التي أصدرت الخطاب</li><li><b>ج.</b> ما رقم الطلب</li><li><b>د.</b> ما تاريخ الخطاب</li></ul></li>
<li><p>إشعار إفصاح يقول: «تستخدم الجمعية الذكاء الاصطناعي لتحسين خدماتها». ما الذي ينقصه أكثر؟</p><ul><li><b>أ.</b> اسم النموذج الذي يستعمله المساعد، ورقم نسخته، والجهة التي طورته</li><li><b>ب.</b> من يقرر في الطلب، وما يفعله المساعد فيه، وكيف يطلب المتقدم الدراسة دونه</li><li><b>ج.</b> عدد الطلبات التي درسها المساعد في الشهر الماضي، ونسبة دقته فيها مقارنة بالأخصائيين</li><li><b>د.</b> شكر المتقدم على ثقته، ووعده بأن الجمعية تحرص على خصوصيته</li></ul></li>
<li><p>مسار تظلم في خطاب: «يمكنكم التظلم عبر الموقع خلال 30 يومًا». المتقدم مسنة لا تستخدم الإنترنت. ما الإضافة التي تجعل المسار يصل إليها؟</p><ul><li><b>أ.</b> رابط مختصر لصفحة التظلم في موقع الجمعية على الإنترنت</li><li><b>ب.</b> مهلة أطول للتظلم</li><li><b>ج.</b> قناة غير رقمية، كمكتب الاستقبال أو قريب مفوض</li><li><b>د.</b> نسخة إنجليزية من الخطاب</li></ul></li>
<li><p>كل لغة من الإشعار تُختبر على قرائها وحدها، لأن الترجمة قد تُسقط ما فهمه قارئ اللغة الأخرى.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: الإشراف المقيس وقرار الإطلاق</h2>
<ol>
<li><p>في الإيجار الطارئ، اختبار «الطلب العاجل لا يُقترح عاديًا» على شريحة الطلبات بالهاتف: 14 حالة، ولا خطأ فيها. الحد الأقصى 5%، والحد الأدنى للعدد 20.</p><ul><li><b>أ.</b> اجتياز، فلا خطأ في الحالات الأربع عشرة</li><li><b>ب.</b> عدد لا يكفي، فلا اجتياز ولا إخفاق</li><li><b>ج.</b> إخفاق، لأن العدد أقل من الحد الأدنى</li><li><b>د.</b> اجتياز ما دام الإجمالي ناجحًا</li></ul></li>
<li><p>في الإيجار الطارئ عُلِّم أسبوع المكتب ب الرابع: اتفاق 100% وزمن وسيط 41 ثانية. أي إجراء يكتب في المواصفات؟</p><ul><li><b>أ.</b> إنذار مكتوب يُحفظ في ملف موظفي المكتب ب</li><li><b>ب.</b> مراجعة كل طلبات الجمعية من الآن فصاعدًا</li><li><b>ج.</b> يراجع المشرف قرارات ذلك الأسبوع، ويناقش العبء</li><li><b>د.</b> إيقاف المسودات في كل المكاتب حتى يُنظر في الأمر</li></ul></li>
<li><p>مشرف واحد في مكتب منح، له 5 ساعات أسبوعيًا للمراجعة الثانية، والمراجعة 15 دقيقة. يصل المكتب 100 قرار في الأسبوع. ما أعلى نسبة عينة تتسع لها الطاقة؟</p><ul><li><b>أ.</b> 5%</li><li><b>ب.</b> 15%</li><li><b>ج.</b> 30%</li><li><b>د.</b> 20%</li></ul></li>
<li><p>في مكتب منح افتراضي، موظف اعتمد 100% من المسودات أربعة أسابيع، وزمنه الوسيط نزل من 120 إلى 35 ثانية. أي عتبة تفعيل تلتقطه دون أن تُفعَّل على كل موظف سريع؟</p><ul><li><b>أ.</b> زمن وسيط للدراسة تحت 60 ثانية في الأسبوع، وحده، لكل موظف في المكتب دون استثناء</li><li><b>ب.</b> نسبة اعتماد 98% فأكثر للمسودات في الأسبوع، وحدها</li><li><b>ج.</b> اعتماد 98% فأكثر وزمن وسيط تحت 60 ثانية معًا، في 10 حالات على الأقل</li><li><b>د.</b> أي أسبوع لم يصل فيه تظلم واحد على قرارات الموظف من المتقدمين كلهم</li></ul></li>
<li><p>أُعلمت عتبة الموافقة الشكلية على أسبوع لأخصائي. أي إجراء يحفظ الإشراف ولا يدفع الأخصائيين إلى تغيير المسودات لمجرد أن يبدوا يقظين؟</p><ul><li><b>أ.</b> مراجعة ثانية لأسبوعه كله ومناقشة أسبابه، دون أن يُقيَّم بعدد الحالات ذلك الأسبوع</li><li><b>ب.</b> خصم من تقييم الأخصائي الشهري بقدر الأسابيع التي أُعلمت فيها العتبة عليه، حتى يتنبه</li><li><b>ج.</b> إيقاف حسابه في الأداة أسبوعًا كاملًا حتى يراجع المشرف كل ما اعتمده من قبل</li><li><b>د.</b> رفع العتبة حتى لا تُفعَّل عليه</li></ul></li>
<li><p>يكفي في مواصفات الإشراف أن يكون الأخصائي هو من يراجع قراراته مراجعة ثانية، إذا خصص لها وقتًا منفصلًا.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>مراجعة إطلاق لمساعد في مكتب منح: ضابطان من أربعة نجحا، وفشل ضابط في شريحة الطلبات المكتوبة بخط اليد، وفشل آخر في خطاب لغة واحدة يمكن إصلاحه في يومين. ما القرار الذي تسنده الأدلة؟</p><ul><li><b>أ.</b> إطلاق كامل على كل الطلبات، لأن نصف الضوابط نجح، والفشل في الباقي محصور في شريحتين يمكن مراقبتهما بعد الإطلاق</li><li><b>ب.</b> عدم إطلاق، لأن ضابطين من أربعة فشلا، والفشل في أي ضابط يمنع الإطلاق كله حتى ينجح</li><li><b>ج.</b> إطلاق مشروط: الخطاب يُصلح ويُعاد اختباره قبل الإطلاق، والطلبات المكتوبة بخط اليد تُدرس دون مسودة حتى ينجح ضابطها</li><li><b>د.</b> إطلاق مشروط بكل الطلبات، والشروط تُكتب بعد الإطلاق حين تتضح المشكلات في التشغيل الفعلي للمساعد</li></ul></li>
<li><p>أي هذه محفز تراجع صالح لسجل إطلاق؟</p><ul><li><b>أ.</b> إذا رأى الفريق أن جودة المساعد ساءت في أي أسبوع مقارنة بأسابيع التجربة الأولى التي سبقت الإطلاق</li><li><b>ب.</b> إذا اشتكى المتقدمون كثيرًا من القرارات أو من الخطابات في مكتب الاستقبال أو بنموذج الجمعية</li><li><b>ج.</b> إذا رأت الإدارة العليا أن ذلك مناسب بعد نقاش يعقد في نهاية كل ربع مع فريق المنتج وفريق الجودة معًا</li><li><b>د.</b> إذا تجاوز الخطأ 5% في أي شريحة فيها 20 حالة على الأقل في التدقيق أسبوعين متتاليين، يوقف المشرف المسودات فيها</li></ul></li>
<li><p>في لجنة إطلاق، قائد المنتج اقترح الإطلاق وعرض الأدلة. ما دوره في التصويت على القرار؟</p><ul><li><b>أ.</b> يصوت أولًا لأنه الأعلم بالمنتج</li><li><b>ب.</b> لا يصوت: من اقترح لا يقرر</li><li><b>ج.</b> صوته يرجح عند التعادل</li><li><b>د.</b> يصوت بدل أخصائي الحوكمة إن غاب</li></ul></li>
<li><p>شرط في سجل الإطلاق بلا مالك ولا موعد يبقى شرطًا صالحًا إذا كُتب الدليل الذي يغلقه.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>في الإطار الوطني لإدارة مخاطر الذكاء الاصطناعي، يُصعَّد قرار النظام عند المخاطر المرتفعة إلى المستوى الحوكمي المناسب، ومن الخيارات الإطلاق المشروط أو تقييد الاستخدام.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
</ol>
